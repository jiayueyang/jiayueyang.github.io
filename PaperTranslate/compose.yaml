services:
  papertranslate:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PT_DATA_DIR: /var/lib/papertranslate
    volumes:
      - papers:/var/lib/papertranslate
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
volumes:
  papers:
