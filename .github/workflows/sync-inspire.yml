name: Sync INSPIRE citations

on:
  workflow_dispatch:
  schedule:
    - cron: "22 11 * * *" # Daily, 11:22 UTC (time varies with daylight saving)
  push:
    paths:
      - ".github/workflows/sync-inspire.yml"
      - "scripts/sync_inspire.py"

permissions:
  contents: write

concurrency:
  group: sync-inspire-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out homepage
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read official INSPIRE statistics and refresh homepage
        run: python scripts/sync_inspire.py

      - name: Commit updated citation counts
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "chore: sync INSPIRE publication and citation counts"
            git push origin HEAD:main
          else
            echo "INSPIRE counts are already current."
          fi
